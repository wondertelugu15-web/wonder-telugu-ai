name: Wonder Telugu Free Health Reel

on:
  workflow_dispatch:
  schedule:
    # Weekly pilot build, not auto-publishing. GitHub Actions uses UTC.
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
  build-health-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Telugu fonts and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate Telugu animated health reel
        run: python generate_health_reel.py
      - name: Upload video artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: wonder-telugu-health-reel
          path: wonder_telugu_health_reel.mp4
          if-no-files-found: error
          retention-days: 7

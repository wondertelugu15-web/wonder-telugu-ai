name: Wonder Telugu Replicate Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate Telugu character voices
        env:
          GIGGY_API_KEY: ${{ secrets.GIGGY_API_KEY }}
        run: python generate_audio.py
      - name: Generate one capped Replicate test scene
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: python generate_replicate_test.py
      - name: Save test video
        uses: actions/upload-artifact@v4
        with:
          name: wonder-telugu-replicate-test
          path: replicate_test_scene.mp4
          if-no-files-found: error
          retention-days: 7

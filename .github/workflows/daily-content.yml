name: Wonder Telugu Daily Video

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Telugu voice
        run: python generate_audio.py

      - name: Generate video
        run: python generate_video.py

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: wonder-telugu-video
          path: wonder_telugu_video.mp4
          retention-days: 7
      - name: Upload video to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python youtube_upload.py

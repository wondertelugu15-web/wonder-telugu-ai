
name: Wonder Telugu Daily Content

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Telugu facts script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p content
          DATE=$(TZ=Asia/Kolkata date +%F)

          if [ -f "content/$DATE.md" ]; then
            echo "Today's content already exists."
            exit 0
          fi

          PROMPT="Write one original, fascinating Telugu YouTube Shorts script about an interesting science, nature, space or world fact. Use Telugu script, 120-150 words, a strong opening hook, accurate factual information, simple explanation, and engaging ending. Include a title, narration, description and hashtags. Do not invent facts. Mention sources to verify."

          curl -sS \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -d "$(jq -n --arg p "$PROMPT" '{contents:[{parts:[{text:$p}]}]}')" \
            -o response.json

          SCRIPT=$(jq -r '[.candidates[0].content.parts[].text] | join("\n")' response.json)

          if [ -z "$SCRIPT" ] || [ "$SCRIPT" = "null" ]; then
            echo "AI generation failed."
            cat response.json
            exit 1
          fi

          printf "# Wonder Telugu - %s\n\n%s\n" "$DATE" "$SCRIPT" > "content/$DATE.md"

          git config user.name "Wonder Telugu Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "Create Telugu content for $DATE"
          git push

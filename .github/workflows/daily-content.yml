
name: Wonder Telugu Daily Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check cooking video clips
        run: |
          python -c "from pathlib import Path; p=Path('assets/videos'); files=list(p.glob('*.mp4')) if p.exists() else []; print('Found',len(files),'video clips'); assert len(files)>0, 'Add cooking clips to assets/videos first'"

      - name: Generate Telugu voice
        run: python generate_audio.py

      - name: Generate cooking video
        run: python generate_video.py

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: wonder-telugu-video
          path: |
            wonder_telugu_video.mp4
            telugu_audio.mp3
          retention-days: 7

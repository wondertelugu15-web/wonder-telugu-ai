
name: Wonder Telugu Daily Content

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Telugu facts script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          mkdir -p content
          DATE=$(TZ=Asia/Kolkata date +%F)

          PROMPT="Create one original Telugu YouTube Shorts script about an interesting science, nature, space or world fact. Write in Telugu, 120-150 words. Include an engaging hook, accurate explanation, title, description and hashtags. Never invent facts."

          HTTP_CODE=$(curl -sS \
            -w "%{http_code}" \
            -o response.json \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -d "$(jq -n --arg p "$PROMPT" '{contents:[{parts:[{text:$p}]}]}')")

          echo "API Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Gemini API Error:"
            jq -r '.error.message // .' response.json
            exit 1
          fi

          SCRIPT=$(jq -r '[.candidates[]?.content.parts[]?.text // empty] | join("\n")' response.json)

          if [ -z "$SCRIPT" ]; then
            echo "No content generated:"
            cat response.json
            exit 1
          fi

          printf "# Wonder Telugu - %s\n\n%s\n" "$DATE" "$SCRIPT" > "content/$DATE.md"

          git config user.name "Wonder Telugu Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "Generate Telugu facts content"
          git push

name: Wonder Telugu Giggy Voice Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy==2.2.1
      - name: Validate Giggy configuration and story
        env:
          GIGGY_API_KEY: ${{ secrets.GIGGY_API_KEY }}
        run: |
          python - <<'PY'
          import os, runpy
          from pathlib import Path
          if not os.environ.get("GIGGY_API_KEY", "").strip():
              raise SystemExit("Missing GIGGY_API_KEY repository secret.")
          ns = runpy.run_path("generate_audio.py")
          story_file = sorted(Path("content").glob("*.md"))[-1]
          scenes = ns["parse_scene_dialogue"](ns["extract_script"](story_file.read_text(encoding="utf-8")))
          print(f"Validated {len(scenes)} scenes for Giggy TTS.")
          for scene, lines in scenes.items():
              print(f"Scene {scene}: {len(lines)} lines")
          PY
      - name: Generate free Giggy Batch voice preview
        env:
          GIGGY_API_KEY: ${{ secrets.GIGGY_API_KEY }}
        run: python generate_audio.py
      - name: Upload Giggy voice preview
        uses: actions/upload-artifact@v4
        with:
          name: wonder-telugu-giggy-voice-preview
          path: |
            telugu_audio.mp3
            assets/audio/scene_*.mp3
          retention-days: 7
